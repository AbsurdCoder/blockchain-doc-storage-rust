[package]
name = "blockchain_doc_storage"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Blockchain-based document verification platform"
license = "MIT"

[dependencies]
# Web framework
actix-web = "4.9"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "uuid"] }

# Cryptography
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9.3"
bcrypt = "0.16"

# Environment and configuration
dotenv = "0.15"
config = "0.14"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# HTTP client (for S3 and blockchain)
reqwest = { version = "0.12", features = ["json", "multipart"] }

# AWS S3
aws-sdk-s3 = "1.66"
aws-config = "1.5"
aws-credential-types = "1.2"

# Ethereum/Blockchain
ethers = "2.0"

# Validation
validator = { version = "0.19", features = ["derive"] }

[dev-dependencies]
actix-rt = "2.10"

[[bin]]
name = "blockchain_doc_storage"
path = "src/main.rs"
